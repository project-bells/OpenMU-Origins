events {
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name muorigins.online www.muorigins.online;

        include conf.d/nginx.prod.certificates.conf;
        server_tokens off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name admin.muorigins.online;

        include conf.d/nginx.prod.certificates.conf;
        server_tokens off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect http://admin.muorigins.online/ https://admin.muorigins.online/;

        location / {
            proxy_pass http://openmu-startup:8080;
        }
    }

    server {
        listen 443 default_server ssl http2;
        listen [::]:443 default_server ssl http2;
        server_name _;

        include conf.d/nginx.prod.certificates.conf;
        return 404;
    }
}
